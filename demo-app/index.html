<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Demo App</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
      nav ul { display: flex; gap: 0.75rem; list-style: none; padding: 0; margin: 0; }
      nav a { color: #1d4ed8; }
      nav a[aria-current='true'] { font-weight: 700; text-decoration: none; }
      label { display: block; margin-top: 1rem; font-weight: 600; }
      input, textarea { width: 100%; padding: 0.5rem; font: inherit; box-sizing: border-box; }
      /* fixed-width button, like many real UIs: a long translation will not fit */
      button {
        margin-top: 1rem; padding: 0.5rem 1rem; font: inherit; background: #1d4ed8; color: #fff; border: 0; border-radius: 4px;
        width: 8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .error { color: #b91c1c; }
      .success { color: #166534; font-weight: 600; }
    </style>
  </head>
  <body>
    <header>
      <nav data-i18n-attr="aria-label:languageNav" aria-label="Language">
        <ul>
          <li><a href="?lang=en" hreflang="en" lang="en" data-lang="en">EN</a></li>
          <li><a href="?lang=it" hreflang="it" lang="it" data-lang="it">IT</a></li>
          <li><a href="?lang=pt" hreflang="pt" lang="pt" data-lang="pt">PT</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <h1 data-i18n="heading"></h1>
      <form data-test="contact-form" novalidate>
        <label for="name" data-i18n="nameLabel"></label>
        <input id="name" name="name" data-test="name" autocomplete="name" />

        <label for="email" data-i18n="emailLabel"></label>
        <input id="email" name="email" type="email" data-test="email" autocomplete="email" />

        <label for="message" data-i18n="messageLabel"></label>
        <textarea id="message" name="message" rows="4" data-test="message"></textarea>

        <p class="error" data-test="error" data-i18n="errorRequired" role="alert" hidden></p>
        <button type="submit" data-test="submit" data-i18n="submit"></button>
      </form>
      <p class="success" data-test="success" role="status" hidden></p>
    </main>

    <script>
      const SUPPORTED = ['en', 'it', 'pt'];
      const requested = new URLSearchParams(location.search).get('lang');
      const lang = SUPPORTED.includes(requested) ? requested : 'en';

      const form = document.querySelector('[data-test="contact-form"]');
      const error = document.querySelector('[data-test="error"]');
      const success = document.querySelector('[data-test="success"]');
      let messages = {};

      // texts come from demo-app/i18n/<lang>.json, the same files the tests read
      async function applyTranslations() {
        const response = await fetch(`i18n/${lang}.json`);
        messages = await response.json();

        document.documentElement.lang = lang;
        document.title = messages.title;
        document.querySelectorAll('[data-i18n]').forEach((el) => {
          el.textContent = messages[el.dataset.i18n];
        });
        document.querySelectorAll('[data-i18n-attr]').forEach((el) => {
          const [attr, key] = el.dataset.i18nAttr.split(':');
          el.setAttribute(attr, messages[key]);
        });
        document.querySelector(`[data-lang="${lang}"]`).setAttribute('aria-current', 'true');
      }

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const name = form.name.value.trim();
        const email = form.email.value.trim();

        if (!name || !email) {
          error.hidden = false;
          return;
        }

        error.hidden = true;
        form.hidden = true;
        success.textContent = messages.success.replace('{name}', name);
        success.hidden = false;
      });

      applyTranslations();
    </script>
  </body>
</html>
