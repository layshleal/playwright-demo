name: Playwright tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * *' # nightly run
  workflow_dispatch:

# a new push to a PR cancels the outdated run; runs on main are never cancelled
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      # Playwright lint rules: no fixed waits, web-first assertions, no missing awaits
      - run: npm run lint

  test:
    name: ${{ matrix.project }}
    # pinned (not ubuntu-latest): visual baselines depend on the OS fonts of this exact image
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: firefox
            browser: firefox
          - project: mobile
            browser: webkit
          - project: demo
            browser: chromium
          - project: api
            browser: ''

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install browsers
        if: matrix.browser != ''
        # A slow Ubuntu mirror once hung this step until the 20-minute job limit.
        # Cap each attempt at 4 minutes (a normal install takes about 1) and retry.
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          for attempt in 1 2 3; do
            timeout --kill-after=30s 4m npx playwright install --with-deps "$BROWSER" && exit 0
            echo "::warning::Browser install attempt $attempt failed or timed out, retrying"
          done
          exit 1

      - name: Run tests
        run: npx playwright test --project=${{ matrix.project }}
        env:
          BLOB_REPORT_NAME: ${{ matrix.project }}
          # nightly run: a test that only passes on retry fails the job
          FAIL_ON_FLAKY: ${{ github.event_name == 'schedule' }}

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/junit.xml
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: blob-${{ matrix.project }}
          path: blob-report/
          retention-days: 1

  publish-report:
    name: publish report
    needs: test
    # publish even when tests fail (a red report is still useful), but only from main
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          pattern: blob-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge reports into one HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - uses: actions/upload-pages-artifact@v5
        with:
          path: playwright-report/

      - id: deploy
        uses: actions/deploy-pages@v5
